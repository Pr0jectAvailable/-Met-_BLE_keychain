[env:nicenano]
platform = nordicnrf52
board = nice_nano
framework = arduino
board_build.name = nice!nano (Pro Micro nRF52840)

upload_protocol = nrfutil
monitor_speed = 115200

build_flags =
    -DNRF52840_XXAA
    -DCFG_DEBUG=0
    -Iheaders

; pintest_main.cpp is only for env:pintest (excluded from the real firmware).
build_src_filter = +<*> -<pintest_main.cpp>


[swd]
upload_command = "C:/Espressif/tools/openocd-esp32/v0.12.0-esp32-20240318/openocd-esp32/bin/openocd.exe" -s "C:/Espressif/tools/openocd-esp32/v0.12.0-esp32-20240318/openocd-esp32/share/openocd/scripts" -f interface/cmsis-dap.cfg -c "cmsis-dap backend usb_bulk" -c "cmsis-dap vid_pid 0x303a 0x1002" -f target/nrf52.cfg -c "adapter speed 1000" -c "program {$BUILD_DIR/${PROGNAME}.elf} verify reset exit"

[env:nicenano_swd]
extends = env:nicenano
upload_protocol = custom
upload_command = ${swd.upload_command}

# Power-test build: BLE scanner disabled to isolate whether the ~90%% duty
# scan causes brownout resets. Flash, then watch the BOOT block / bootcnt.
[env:power_test]
extends = env:nicenano
build_flags =
    -DNRF52840_XXAA
    -DCFG_DEBUG=0
    -Iheaders
    -DENABLE_BLE_SCAN=0

; Minimal no-BLE sanity test: isolates chip/USB/reset from the SoftDevice app.
; Builds only test/main.cpp and flashes over SWD (USB DFU is unreachable here).
[env:pintest]
extends = env:nicenano
build_src_filter = +<pintest_main.cpp>
